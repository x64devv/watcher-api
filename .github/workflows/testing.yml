name: Watcher-sockets

on:
  push:
    branches:
      - sockets

jobs:
  build-and-push:
    environment: testing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ vars.DOCKER_EMAIL }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image with Maven
        run: |
          ./mvnw spring-boot:build-image -Dspring-boot.build-image.imageName=docker.io/${{ vars.DOCKER_USERNAME }}/watcher-api:${{ github.sha }}