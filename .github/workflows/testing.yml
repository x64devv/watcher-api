name: Watcher-sockets

on:
  push:
    branches:
      - sockets

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
#      - name: Setup Buildx
#        uses: docker/setup-buildx-action@v3
      - name: Custom build
        run:   ./mvnw spring-boot:build-image

      - name: Login to docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_EMAIL }}
          password: ${{ secrets.DOCKER_PASS }}
      - name: Check for missing secrets
        run: |
          set -e  # Stops execution on any error
          if [[ -z "${{ secrets.DOCKER_USERNAME }}" ]]; then
            echo "Error: Missing secret DOCKER_USERNAME"
            exit 1
          fi
          # Add checks for other required secrets
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          no-cache: true
          push: true
          tags: "${{ secrets.DOCKER_USERNAME }}/${{secrets.APP_NAME}}:${{github.sha}}"